<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>You're offline | Watchlist</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<style>
			:root {
				color-scheme: dark;
				--bg: #0a0a0a;
				--fg: #fafafa;
				--muted: #a1a1aa;
				--accent: #f5f5f5;
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				min-height: 100svh;
				display: grid;
				place-items: center;
				padding: 24px 16px;
				background: var(--bg);
				color: var(--fg);
				font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			main {
				max-width: 26rem;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 16px;
				text-align: center;
			}
			img { width: 56px; height: 56px; }
			h1 { margin: 8px 0 0; font-size: 1.75rem; font-weight: 600; letter-spacing: -0.03em; }
			p { margin: 0; color: var(--muted); line-height: 1.5; text-wrap: pretty; }
			.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
			a, button {
				font: inherit;
				font-size: 0.9rem;
				font-weight: 500;
				border-radius: 999px;
				padding: 10px 18px;
				cursor: pointer;
				text-decoration: none;
			}
			button { border: 0; background: var(--fg); color: var(--bg); }
			a { color: var(--fg); border: 1px solid color-mix(in srgb, var(--fg) 20%, transparent); }
			a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
		</style>
	</head>
	<body>
		<main>
			<img src="/favicon.svg" alt="" />
			<h1>You're offline</h1>
			<p>
				This page hasn't been saved for offline use yet. Pages you've opened before
				still work, and so does your watchlist.
			</p>
			<div class="actions">
				<button type="button" onclick="location.reload()">Try again</button>
				<a href="/watchlist">Open watchlist</a>
			</div>
		</main>
		<script>
			addEventListener("online", function () { location.reload(); });
		</script>
	</body>
</html>
